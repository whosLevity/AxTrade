# DOCUMENTATION: https://docs.artillex-studios.com/axtrade.html
# ITEM BUILDER: https://docs.artillex-studios.com/item-builder.html

# ----- SETTINGS -----
title: "&0Trading with: %player%"
rows: 6

# ----- SLOTS -----
own-slots:
  - 9-12
  - 18-21
  - 27-30
  - 36-39
  - 45-48

partner-slots:
  - 14-17
  - 23-26
  - 32-35
  - 41-44
  - 50-53

# ----- ITEMS -----
own:
  confirm-item:
    slot: 0
    accept:
      material: "RED_CONCRETE"
      name: "&#00ffdd&lAccept Trade"
      lore:
        - ""
        - " &7- &fAre you happy with the trade?"
        - ""
        - "&#00ffdd&l> &#00ffddClick &8- &#00ffddConfirm Trade"
    cancel:
      material: "LIME_CONCRETE"
      name: "&#00ffdd&lCancel Confirmation"
      lore:
        - ""
        - " &7- &fDo you want to change something?"
        - ""
        - "&#00ffdd&l> &#00ffddClick &8- &#00ffddCancel Confirmation"

  currency1:
    slot: 2
    currency: "Vault"
    material: "GOLD_NUGGET"
    name: "&#00ffdd&lMoney"
    lore:
      - "&7Your offer"
      - ""
      - " &7- &fAmount: &#00ffdd%amount%$"
      - ""
      - "&#00ffdd&l> &#00ffddClick &8- &#00ffddChange Amount"

  currency2:
    slot: 3
    currency: "Experience"
    material: "EXPERIENCE_BOTTLE"
    name: "&#00ffdd&lExperience"
    lore:
      - "&7Your offer"
      - ""
      - " &7- &fAmount: &#00ffdd%amount% EXP"
      - ""
      - "&#00ffdd&l> &#00ffddClick &8- &#00ffddChange Amount"

  currency-selector:
    enabled: false
    slot: 2
    material: "CLOCK"
    name: "&#00ffdd&lCurrencies"
    lore:
      - "&7Your offer"
      - ""
      - "%selected-lines%"
      - ""
      - "&#00ffdd&l> &#00ffddClick &8- &#00ffddChoose currency"

  cosmetic-item:
    slot: 1
    material: "NETHER_STAR"
    name: "&#00ffdd&lCosmetics"
    lore:
      - "&7Your offer"
      - ""
      - " &7- &fSelected: &#00ffdd%cosmetic%"
      - ""
      - "&#00ffdd&l> &#00ffddClick &8- &#00ffddSelect cosmetic"

partner:
  confirm-item:
    slot: 8
    accept:
      material: "RED_CONCRETE"
      name: "&#00ffdd&lWaiting For Other Player"
      lore:
        - ""
        - " &7- &f%partner-name% has not yet confirmed the trade!"
        - ""
    cancel:
      material: "LIME_CONCRETE"
      name: "&#00ffdd&lWaiting"
      lore:
        - ""
        - " &7- &f%partner-name% has confirmed the trade!"

  currency1:
    slot: 6
    currency: "Vault"
    material: "GOLD_NUGGET"
    name: "&#00ffdd&lMoney"
    lore:
      - "&7%partner-name%'s offer"
      - ""
      - " &7- &fAmount: &#00ffdd%amount%$"
      - ""

  currency2:
    slot: 5
    currency: "Experience"
    material: "EXPERIENCE_BOTTLE"
    name: "&#00ffdd&lExperience"
    lore:
      - "&7%partner-name%'s offer"
      - ""
      - " &7- &fAmount: &#00ffdd%amount% EXP"
      - ""

  currency-selector:
    slot: 6
    material: "CLOCK"
    name: "&#00ffdd&lCurrencies"
    lore:
      - "&7%partner-name%'s offer"
      - ""
      - "%selected-lines%"
      - ""

  cosmetic-item:
    slot: 7
    material: "NETHER_STAR"
    name: "&#00ffdd&lCosmetics"
    lore:
      - "&7%partner-name%'s offer"
      - ""
      - " &7- &fSelected: &#00ffdd%cosmetic%"
      - ""

decoration-example:
  slot: [4, 13, 22, 31, 40, 49]
  material: "LIGHT_BLUE_STAINED_GLASS_PANE"
  name: " "

currency-selector:
  title: "&0Select Currency"
  rows: 3
  slots:
    - 10-16
  close-item:
    slot: 22
    material: "BARRIER"
    name: "&#ff6666&lBack"
    lore:
      - "&7Return to trade"
  items:
    Vault:
      material: "GOLD_NUGGET"
      name: "&#00ffdd&lMoney"
      lore:
        - "&7Your offer"
        - ""
        - " &7- &fAmount: &#00ffdd%amount%$"
        - ""
        - "&#00ffdd&l> &#00ffddClick &8- &#00ffddChange Amount"
    Experience:
      material: "EXPERIENCE_BOTTLE"
      name: "&#00ffdd&lExperience"
      lore:
        - "&7Your offer"
        - ""
        - " &7- &fAmount: &#00ffdd%amount% EXP"
        - ""
        - "&#00ffdd&l> &#00ffddClick &8- &#00ffddChange Amount"

version: 1
